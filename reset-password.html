<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen | Selena Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo_dark.png">
</head>
<body class="bg-white antialiased">
    <div id="header-container"></div>

    <main class="pt-32 pb-24 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md mx-auto">
            <div class="bg-white py-8 px-10 border border-gray-200 shadow-sm">
                <h1 id="page-title" class="text-3xl font-serif text-center mb-6">Passwort vergessen?</h1>
                <p id="page-subtitle" class="text-sm text-gray-600 text-center mb-6">Geben Sie Ihre E-Mail-Adresse ein und wir senden Ihnen einen Link zum Zurücksetzen Ihres Passworts.</p>
                
                <form id="reset-form" class="space-y-6">
                    <div id="reset-message" class="hidden text-sm p-3 border"></div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-Mail Adresse *</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 focus:border-gold focus:ring-0 transition-colors">
                    </div>
                    
                    <button type="submit" id="reset-btn" class="w-full bg-gold text-white font-serif tracking-widest uppercase py-3 hover:bg-black transition-colors">
                        Link Senden
                    </button>
                </form>
                <!-- Set New Password Form (Hidden by default) -->
                <form id="new-password-form" class="space-y-6 hidden mt-6">
                    <div id="new-password-message" class="hidden text-sm p-3 border"></div>
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">Neues Passwort *</label>
                        <input type="password" id="new-password" required minlength="6" class="w-full px-4 py-2 border border-gray-300 focus:border-gold focus:ring-0 transition-colors">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Passwort bestätigen *</label>
                        <input type="password" id="confirm-password" required minlength="6" class="w-full px-4 py-2 border border-gray-300 focus:border-gold focus:ring-0 transition-colors">
                    </div>
                    <button type="submit" id="save-password-btn" class="w-full bg-gold text-white font-serif tracking-widest uppercase py-3 hover:bg-black transition-colors">
                        Passwort Speichern
                    </button>
                </form>

                
                <div class="mt-8 text-center text-sm text-gray-600 border-t border-gray-100 pt-6">
                    Zurück zum <a href="login.html" class="text-gold font-medium hover:underline">Login</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw_TmBCgvAwFPZkJ8RQ7_jSFB62KgQVqc",
            authDomain: "selena-events-dashboard.firebaseapp.com",
            projectId: "selena-events-dashboard",
            storageBucket: "selena-events-dashboard.firebasestorage.app",
            messagingSenderId: "535842804912",
            appId: "1:535842804912:web:7464adf97bcdf456131775",
            measurementId: "G-6CXF223NQE"
        };
        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');

        if (mode === 'resetPassword' && oobCode) {
            document.getElementById('page-title').textContent = 'Neues Passwort';
            document.getElementById('page-subtitle').textContent = 'Geben Sie Ihr neues Passwort ein.';
            document.getElementById('reset-form').classList.add('hidden');
            document.getElementById('new-password-form').classList.remove('hidden');
        }

        document.getElementById('new-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const msgDiv = document.getElementById('new-password-message');
            const btn = document.getElementById('save-password-btn');

            if (newPassword !== confirmPassword) {
                msgDiv.className = 'text-red-600 bg-red-50 p-3 text-sm border border-red-200';
                msgDiv.textContent = 'Die Passwörter stimmen nicht überein.';
                msgDiv.classList.remove('hidden');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Bitte warten...';

                await confirmPasswordReset(auth, oobCode, newPassword);
                
                msgDiv.className = 'text-green-600 bg-green-50 p-3 text-sm border border-green-200';
                msgDiv.innerHTML = 'Passwort erfolgreich geändert! <a href="login.html" class="underline font-bold">Jetzt einloggen</a>.';
                btn.classList.add('hidden');
            } catch (error) {
                console.error("Reset Error:", error);
                msgDiv.className = 'text-red-600 bg-red-50 p-3 text-sm border border-red-200';
                msgDiv.textContent = 'Link abgelaufen oder ungültig. Bitte fordern Sie einen neuen an.';
                btn.disabled = false;
                btn.textContent = 'Passwort Speichern';
            }
            msgDiv.classList.remove('hidden');
        });


        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('reset-message');
            const btn = document.getElementById('reset-btn');

            try {
                btn.disabled = true;
                btn.textContent = 'Bitte warten...';

                await fetch("https://us-central1-selena-events-dashboard.cloudfunctions.net/sendCustomPasswordResetEmail", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });
                
                msgDiv.className = 'text-green-600 bg-green-50 p-3 text-sm border border-green-200';
                msgDiv.textContent = 'E-Mail gesendet! Bitte überprüfen Sie Ihren Posteingang (und den Spam-Ordner).';
                btn.textContent = 'Erledigt';
            } catch (error) {
                console.error("Reset Error:", error);
                msgDiv.className = 'text-red-600 bg-red-50 p-3 text-sm border border-red-200';
                msgDiv.textContent = 'Es ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut.';
                btn.disabled = false;
                btn.textContent = 'Link Senden';
            }
            msgDiv.classList.remove('hidden');
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
