<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Insights | Selena Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../assets/logo_dark.png">
</head>
<body class="bg-gray-50 antialiased overflow-x-hidden">

    <div id="header-container"></div>

    <main class="pt-20">
        <section class="bg-white py-16 border-b border-gray-100 scroll-animate">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <h1 class="text-4xl md:text-5xl mb-4 font-serif">Jurnal</h1>
                <p class="text-gray-500 font-light max-w-2xl mx-auto">Inspirație, momente importante de la evenimente și priviri în culisele procesului nostru creativ.</p>
            </div>
        </section>

        <!-- Blog List View -->
        <section class="section-padding max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="blog-list" class="space-y-16 scroll-stagger-group">
                <!-- Dynamic blogs will be rendered here -->
            </div>
        </section>
        </section>
    </main>

    

    <div id="footer-container"></div>

    <script src="../js/main.js"></script>
    <script src="../js/animations.js"></script>
    <script src="js/blog_data.js"></script>
    <script src="../js/blog.js"></script>
</body>
</html>
